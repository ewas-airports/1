function parseEndpoint(token){

  return match?match[1]:cleaned;
}

  const result=[];
  if(rules.includeEndpoints)result.push(dep,dest);
  for(const r of rules.destinationRules){if(r.destination===dest)result.push(...r.airports)}
  for(const r of rules.comboRules){if(r.matchAirports.some(a=>dep===a||dest===a||wps.includes(a))&&r.waypoints.some(w=>wps.includes(w)))result.push(...r.airports)}
  for(const r of rules.waypointRules){if(r.waypoints.some(w=>wps.includes(w)||w===dep||w===dest))result.push(...r.airports)}
  $('result').textContent=[...new Set(result)].sort().join('\n')||'Keine Airports durch die aktiven Regeln ausgewählt.';
}

e()}});$('exportRules').addEventListener('click',()=>{try{const data=readEditor();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='route_alternate_regeln.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('saveStatus').textContent='Regeln exportiert.'}catch(e){$('saveStatus').textContent='Fehler: '+e.message}});function importData(raw){const imported=normalize(JSON.parse(raw.replace(/^\uFEFF/,'')));rules=imported;const stored=persist();renderRules();parseRoute();$('saveStatus').textContent=stored?'Regeln erfolgreich importiert und lokal gespeichert.':'Regeln erfolgreich importiert, aber lokale Speicherung ist blockiert. Bitte JSON sichern.'}

// Pointer-basiertes Drag-and-Drop: funktioniert mit Maus und Touch (iPad).
const gripSvg='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="5" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="19" r="1"/></svg>';
function renumberSubrules(holder){
  if(holder.id==='ruleRows')return;
  [...holder.children].forEach((row,i)=>{
    const label=row.querySelector('.subrule-label');
    const input=row.querySelector('.subrule-name-input');
    if(label&&input)label.textContent=input.value.trim()||String(i+1);
  });
}
function enableRowDrag(row){
  const holder=row.parentElement;
  if(!holder || !holder.classList.contains('rule-editor') || row.querySelector('.drag-handle'))return;
  const handle=document.createElement('button');
  handle.type='button';handle.className='drag-handle';
  handle.title='Unterregel verschieben';handle.setAttribute('aria-label','Unterregel verschieben');
  handle.innerHTML=gripSvg;
  row.prepend(handle);
  let pointerId=null, moved=false, startY=0;
  const finish=e=>{
    if(pointerId!==e.pointerId)return;
    pointerId=null;
    row.classList.remove('dragging');holder.classList.remove('drag-active');
    if(holder.hasPointerCapture(e.pointerId))holder.releasePointerCapture(e.pointerId);
    if(moved){renumberSubrules(holder);$('saveStatus').textContent='Reihenfolge geändert – bitte alle Regeln speichern.';}
  };
  handle.addEventListener('pointerdown',e=>{
    if(e.button!==0 || pointerId!==null)return;
    pointerId=e.pointerId;startY=e.clientY;moved=false;
    // Capture am stabilen Container: Die Zeile wird während des Ziehens im DOM verschoben.
    // Capture am Griff selbst würde dabei verloren gehen.
    holder.setPointerCapture(e.pointerId);
    row.classList.add('dragging');holder.classList.add('drag-active');
    e.preventDefault();
  });
  holder.addEventListener('pointermove',e=>{
    if(pointerId!==e.pointerId)return;
    if(Math.abs(e.clientY-startY)>4)moved=true;
    if(!moved)return;
    e.preventDefault();
    const bounds=holder.getBoundingClientRect();
    if(e.clientY<bounds.top+35)holder.scrollTop-=18;
    else if(e.clientY>bounds.bottom-35)holder.scrollTop+=18;
    const others=[...holder.children].filter(el=>el!==row);
    const next=others.find(el=>e.clientY<el.getBoundingClientRect().top+el.getBoundingClientRect().height/2);
    if(next)holder.insertBefore(row,next);
    else holder.appendChild(row);
    renumberSubrules(holder);
  });
  holder.addEventListener('pointerup',finish);
  holder.addEventListener('pointercancel',finish);

}
function enableAllRowDrag(){
  document.querySelectorAll('.rule-editor > .rule-row').forEach(enableRowDrag);
  document.querySelectorAll('.rule-editor').forEach(renumberSubrules);
}

renderRules=function(){originalRenderRules();enableAllRowDrag()};

addComboRow=function(r){originalAddComboRow(r);enableAllRowDrag()};
